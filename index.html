<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atomy — Официальный партнёр</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #7f8c8d;
      font-size: 16px;
    }
    .cart-icon {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #e74c3c;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
    }
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #3498db;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      display: none;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .product:hover {
      transform: translateY(-4px);
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .product-info {
      padding: 16px;
    }
    .product h3 {
      margin-bottom: 8px;
      font-size: 16px;
    }
    .price {
      font-weight: bold;
      color: #e74c3c;
      font-size: 18px;
      margin: 8px 0;
    }
    .btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }
    .btn:hover {
      background: #2980b9;
    }

    /* Страница товара */
    .product-page {
      display: none;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .product-page img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-bottom: 20px;
    }
    .product-page .price {
      font-size: 24px;
      margin: 15px 0;
    }
    .product-page .add-to-cart-btn {
      background: #2ecc71;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .product-page .add-to-cart-btn:hover {
      background: #27ae60;
    }

    /* Корзина */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .cart-content {
      background: white;
      width: 90%;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 12px;
      position: relative;
    }
    .close-cart {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
    }
    .cart-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
    }
    .cart-item-quantity {
      display: flex;
      align-items: center;
      margin: 0 10px;
    }
    .cart-item-quantity button {
      background: #ecf0f1;
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
    }
    .cart-item-remove {
      background: #e74c3c;
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }
    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
      color: #2c3e50;
    }
    .order-btn {
      background: #2ecc71;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="cart-icon" id="cartIcon">🛒<span id="cartCount">0</span></div>
  <div class="back-button" id="backButton">←</div>

  <header>
    <h1>✨ Atomy — Официальный партнёр</h1>
    <div class="subtitle">Оригинальная продукция • Доставка по РФ • Оплата при получении</div>
  </header>

  <div class="products" id="productList"></div>
  <div class="product-page" id="productPage"></div>

  <!-- Модальное окно корзины -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="close-cart" onclick="closeCart()">×</div>
      <h2>Ваша корзина</h2>
      <div id="cartItems"></div>
      <div class="total">Итого: <span id="totalPrice">0</span> ₽</div>
      <button class="order-btn" onclick="placeOrder()">Оформить заказ</button>
    </div>
  </div>

  <script>
    // Товары
    const products = [
      { 
        id: 1, 
        name: "Atomy Evening Care Foam Cleanser", 
        price: 1200, 
        desc: "Мягкий пенящийся очищающий гель для вечернего ухода. Удаляет макияж и загрязнения.", 
        img: "https://image.atomy.ru/600_600/RU/goods/R00305/org/261/250523000042261.png" 
      },
      { 
        id: 2, 
        name: "Atomy Deep Cleanser", 
        price: 1100, 
        desc: "Глубоко очищает поры, регулирует выработку себума. Подходит для жирной и комбинированной кожи.", 
        img: "https://i.siteapi.org/NuNysiJxxUAuXkk4_Si2Dg0lfeA=/0x0:598x673/s2.siteapi.org/bff174006c724cd/img/nxd7artgtn48wwowcwgosc008wo4ok" 
      },
      { 
        id: 3, 
        name: "Atomy Sunscreen SPF 50+", 
        price: 1500, 
        desc: "Лёгкий невидимый солнцезащитный крем с высокой защитой. Не оставляет белого следа.", 
        img: "https://image.atomy.com/MY/goods/M00275/org/471/241024000028471.jpg?w=1360&h=1360" 
      },
      { 
        id: 4, 
        name: "Atomy Essence", 
        price: 2800, 
        desc: "Концентрированная эссенция для увлажнения и сияния кожи. Основа корейского ухода.", 
        img: "https://image.atomy.ru/40_40/RU/goods/R00194/org/166/250523000042166.jpg" 
      },
      { 
        id: 5, 
        name: "Atomy Eye Cream", 
        price: 2200, 
        desc: "Увлажняющий крем для области вокруг глаз. Уменьшает отёки и тёмные круги.", 
        img: "https://image.atomy.com/CA/goods/C00192/org/192/thumb_fa6b0bb8-bee1-4967-b4f4-25cb4227a772.jpg?w=1360&h=1360" 
      },
      { 
        id: 6, 
        name: "Atomy Moisturizing Cream", 
        price: 2000, 
        desc: "Богатый питательный крем для лица. Восстанавливает кожный барьер и удерживает влагу.", 
        img: "https://image.atomy.ru/1360_1360/RU/goods/R00198/org/728/250523000041728.png" 
      },
      { 
        id: 7, 
        name: "Atomy Cleansing Oil", 
        price: 1400, 
        desc: "Мицеллярное масло для первого этапа очищения. Растворяет водостойкий макияж.", 
        img: "https://image.atomy.ru/1360_1360/RU/goods/R00482/org/188/250523000042188.png" 
      },
      { 
        id: 8, 
        name: "Atomy Body Lotion", 
        price: 1600, 
        desc: "Тоник-лосьон для увлажнения и подготовки кожи к последующему уходу.", 
        img: "https://i.siteapi.org/TBA07ixuObKNYdAFS4lwbkN7Pmk=/0x246:563x900/s2.siteapi.org/bff174006c724cd/img/ddlolvbaisgkg4k44cw00skoo408s0" 
      },
      { 
        id: 9, 
        name: "Atomy Cream Mist", 
        price: 1700, 
        desc: "Легкий туман-уход, который мгновенно увлажняет кожу лица и тела. Идеален для ежедневного использования, особенно в условиях сухого воздуха или после пребывания на солнце. Быстро впитывается, не оставляет липкости.", 
        img: "https://avatars.mds.yandex.net/get-mpic/15049969/2a0000019a1a5e10118efe2f64c49233a91f/orig" 
      },
      { 
        id: 10, 
        name: "HemoHIM (БАД)", 
        price: 3500, 
        desc: "Натуральный растительный комплекс для иммунитета и энергии. На основе корня ангелики.", 
        img: "https://avatars.mds.yandex.net/get-mpic/10576558/2a0000018ce43be46f1af4522d54bd54598d/orig" 
      },
      { 
        id: 11, 
        name: "Atomy Alaska E-Omega3", 
        price: 2900, 
        desc: "Омега-3 из рыбьего жира дикого лосося. Поддержка сердца, мозга и суставов.", 
        img: "https://image.atomy.com/SG/goods/S00111/org/742/241114000029742.jpeg?w=1360&h=1360" 
      },
      { 
        id: 12, 
        name: "Atomy Curling Essence", 
        price: 3200, 
        desc: "Интенсивная эссенция для укрепления и восстановления повреждённых, окрашенных или вьющихся волос. Придаёт блеск, эластичность и защищает от термовоздействия при укладке.", 
        img: "https://image.atomy.ru/1360_1360/RU/goods/R00680/org/508/250523000042508.png" 
      },
      { 
        id: 13, 
        name: "Atomy BB Cream", 
        price: 1900, 
        desc: "BB-крем с уходовыми компонентами и лёгким покрытием. SPF 30.", 
        img: "https://img-edg.joomcdn.net/4bf4adf076bc000588879003a71df7b0b93245c1_1024_1024.jpeg" 
      },
      { 
        id: 14, 
        name: "Atomy Toothpaste Set", 
        price: 800, 
        desc: "Набор зубных паст с натуральными компонентами. Без SLS и парабенов.", 
        img: "https://image.atomy.ru/40_40/RU/goods/R00523/org/769/250523000041769.jpg" 
      },
      { 
        id: 15, 
        name: "Cafe Arabica (80 пакетиков)", 
        price: 1100, 
        desc: "100% арабика в удобных пакетиках. Натуральный кофе без добавок.", 
        img: "https://image.atomy.ru/600_600/RU/goods/R00975/org/659/250523000041659.jpg" 
      }
    ];

    // Корзина
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Функции
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (product) {
        const existing = cart.find(item => item.id === productId);
        if (existing) {
          existing.quantity++;
        } else {
          cart.push({ ...product, quantity: 1 });
        }
        saveCart();
        updateCartUI();
        // Убрано alert — теперь просто обновляется иконка корзины
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      saveCart();
      updateCartUI();
      renderCart(); // Обновляем корзину
    }

    function updateQuantity(productId, change) {
      const item = cart.find(item => item.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          removeFromCart(productId);
        } else {
          saveCart();
          updateCartUI();
          renderCart();
        }
      }
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function openCart() {
      renderCart();
      document.getElementById('cartModal').style.display = 'block';
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function renderCart() {
      const cartItemsEl = document.getElementById('cartItems');
      const totalPriceEl = document.getElementById('totalPrice');

      if (cart.length === 0) {
        cartItemsEl.innerHTML = '<p>Корзина пуста</p>';
        totalPriceEl.textContent = '0';
        return;
      }

      let html = '';
      let total = 0;
      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <strong>${item.name}</strong><br>
              ${item.price} ₽ × ${item.quantity} = ${itemTotal} ₽
            </div>
            <div class="cart-item-actions">
              <div class="cart-item-quantity">
                <button onclick="updateQuantity(${item.id}, -1)">–</button>
                <span>${item.quantity}</span>
                <button onclick="updateQuantity(${item.id}, 1)">+</button>
              </div>
              <button class="cart-item-remove" onclick="removeFromCart(${item.id})">×</button>
            </div>
          </div>
        `;
      });

      cartItemsEl.innerHTML = html;
      totalPriceEl.textContent = total;
    }

    function placeOrder() {
      if (cart.length === 0) {
        alert("Корзина пуста!");
        return;
      }

      const name = prompt("Введите ваше имя:");
      const contact = prompt("Введите ваш телефон или Telegram (например, @username):");
      
      if (!name || !contact) {
        alert("Имя и контакт обязательны для оформления заказа!");
        return;
      }

      let orderText = "";
      let total = 0;
      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        orderText += `${item.name} — ${item.quantity} шт × ${item.price} ₽ = ${itemTotal} ₽\n`;
      });
      orderText += `\nИтого: ${total} ₽`;

      // Отправка на Formspree
      fetch("https://formspree.io/f/mzddzbay", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,
          contact: contact,
          order: orderText,
          total: total
        })
      })
      .then(response => {
        if (response.ok) {
          alert("✅ Спасибо за заказ! Я скоро с вами свяжусь.");
          cart = [];
          saveCart();
          updateCartUI();
          closeCart();
        } else {
          alert("Ошибка отправки. Попробуйте позже.");
        }
      })
      .catch(() => {
        alert("Не удалось отправить заказ. Проверьте подключение к интернету.");
      });
    }

    // Рендер товаров
    function renderProducts() {
      const container = document.getElementById('productList');
      container.innerHTML = products.map(p => `
        <div class="product" onclick="showProduct(${p.id})">
          <img src="${p.img}" alt="${p.name}" style="width:100%; height:200px; object-fit:cover;">
          <div class="product-info">
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
            <div class="price">${p.price} ₽</div>
            <button class="btn">Подробнее</button>
          </div>
        </div>
      `).join('');
    }

    function showProduct(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const productPage = document.getElementById('productPage');
      const productList = document.getElementById('productList');
      const backButton = document.getElementById('backButton');

      productList.style.display = 'none';
      productPage.style.display = 'block';
      backButton.style.display = 'flex';

      productPage.innerHTML = `
        <div style="text-align: center;">
          <img src="${product.img}" alt="${product.name}" style="max-width: 100%; max-height: 400px; object-fit: contain; margin-bottom: 20px;">
          <h2>${product.name}</h2>
          <div class="price">${product.price} ₽</div>
          <p style="margin: 20px 0;">${product.desc}</p>
          <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Добавить в корзину</button>
        </div>
      `;
    }

    function goBackToCatalog() {
      const productPage = document.getElementById('productPage');
      const productList = document.getElementById('productList');
      const backButton = document.getElementById('backButton');

      productList.style.display = 'grid';
      productPage.style.display = 'none';
      backButton.style.display = 'none';
    }

    // Инициализация
    document.getElementById('cartIcon').addEventListener('click', openCart);
    document.getElementById('backButton').addEventListener('click', goBackToCatalog);
    renderProducts();
    updateCartUI();

    window.onclick = function(event) {
      const modal = document.getElementById('cartModal');
      if (event.target === modal) closeCart();
    }
  </script>
</body>
  </html>
