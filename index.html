  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9f9f9;
      color: #2c3e50;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #7f8c8d;
      font-size: 16px;
    }
    .cart-icon {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #e74c3c;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
    }
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #3498db;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      display: none;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .product:hover {
      transform: translateY(-4px);
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .product-info {
      padding: 16px;
    }
    .product h3 {
      margin-bottom: 8px;
      font-size: 16px;
    }
    .price {
      font-weight: bold;
      color: #e74c3c;
      font-size: 18px;
      margin: 8px 0;
    }
    .btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }
    .btn:hover {
      background: #2980b9;
    }

    /* Страница товара */
    .product-page {
      display: none;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .product-page img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-bottom: 20px;
    }
    .product-page .price {
      font-size: 24px;
      margin: 15px 0;
    }
    .product-page .add-to-cart-btn {
      background: #2ecc71;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .product-page .add-to-cart-btn:hover {
      background: #27ae60;
    }

    /* Корзина */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .cart-content {
      background: white;
      width: 90%;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 12px;
      position: relative;
    }
    .close-cart {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
    }
    .cart-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
    }
    .cart-item-quantity {
      display: flex;
      align-items: center;
      margin: 0 10px;
    }
    .cart-item-quantity button {
      background: #ecf0f1;
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
    }
    .cart-item-remove {
      background: #e74c3c;
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }
    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
      color: #2c3e50;
    }
    .order-btn {
      background: #2ecc71;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

    // Корзина
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Функции
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (product) {
        const existing = cart.find(item => item.id === productId);
        if (existing) {
          existing.quantity++;
        } else {
          cart.push({ ...product, quantity: 1 });
        }
        saveCart();
        updateCartUI();
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      saveCart();
      updateCartUI();
      renderCart();
    }

    function updateQuantity(productId, change) {
      const item = cart.find(item => item.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          removeFromCart(productId);
        } else {
          saveCart();
          updateCartUI();
          renderCart();
        }
      }
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function openCart() {
      renderCart();
      document.getElementById('cartModal').style.display = 'block';
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function renderCart() {
      const cartItemsEl = document.getElementById('cartItems');
      const totalPriceEl = document.getElementById('totalPrice');

      if (cart.length === 0) {
        cartItemsEl.innerHTML = '<p>Корзина пуста</p>';
        totalPriceEl.textContent = '0';
        return;
      }

      let html = '';
      let total = 0;
      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <strong>${item.name}</strong><br>
              ${item.price} ₽ × ${item.quantity} = ${itemTotal} ₽
            </div>
            <div class="cart-item-actions">
              <div class="cart-item-quantity">
                <button onclick="updateQuantity(${item.id}, -1)">–</button>
                <span>${item.quantity}</span>
                <button onclick="updateQuantity(${item.id}, 1)">+</button>
              </div>
              <button class="cart-item-remove" onclick="removeFromCart(${item.id})">×</button>
            </div>
          </div>
        `;
      });

      cartItemsEl.innerHTML = html;
      totalPriceEl.textContent = total;
    }

    function placeOrder() {
      if (cart.length === 0) {
        alert("Корзина пуста!");
        return;
      }

      const name = prompt("Введите ваше имя:");
      const contact = prompt("Введите ваш телефон или Telegram (например, @username):");
      
      if (!name || !contact) {
        alert("Имя и контакт обязательны для оформления заказа!");
        return;
      }

      let orderText = "";
      let total = 0;
      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        orderText += `${item.name} — ${item.quantity} шт × ${item.price} ₽ = ${itemTotal} ₽\n`;
      });
      orderText += `\nИтого: ${total} ₽`;

      // Отправка на Formspree
      fetch("https://formspree.io/f/mzddzbay", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,
          contact: contact,
          order: orderText,
          total: total
        })
      })
      .then(response => {
        if (response.ok) {
          alert("✅ Спасибо за заказ! Я скоро с вами свяжусь.");
          cart = [];
          saveCart();
          updateCartUI();
          closeCart();
        } else {
          alert("Ошибка отправки. Попробуйте позже.");
        }
      })
      .catch(() => {
        alert("Не удалось отправить заказ. Проверьте подключение к интернету.");
      });
    }

    // Рендер товаров
    function renderProducts() {
      const container = document.getElementById('productList');
      container.innerHTML = products.map(p => `
        <div class="product" onclick="showProduct(${p.id})">
          <img src="${p.img}" alt="${p.name}" style="width:100%; height:200px; object-fit:cover;">
          <div class="product-info">
            <h3>${p.name}</h3>
            <div class="price">${p.price} ₽</div>
            <button class="btn">Подробнее</button>
          </div>
        </div>
      `).join('');
    }

    function showProduct(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const productPage = document.getElementById('productPage');
      const productList = document.getElementById('productList');
      const backButton = document.getElementById('backButton');

      productList.style.display = 'none';
      productPage.style.display = 'block';
      backButton.style.display = 'flex';

      productPage.innerHTML = `
        <div style="text-align: center;">
          <img src="${product.img}" alt="${product.name}" style="max-width: 100%; max-height: 400px; object-fit: contain; margin-bottom: 20px;">
          <h2>${product.name}</h2>
          <div class="price">${product.price} ₽</div>
          <p style="margin: 20px 0;">${product.desc}</p>
          <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Добавить в корзину</button>
        </div>
      `;
    }

    function goBackToCatalog() {
      const productPage = document.getElementById('productPage');
      const productList = document.getElementById('productList');
      const backButton = document.getElementById('backButton');

      productList.style.display = 'grid';
      productPage.style.display = 'none';
      backButton.style.display = 'none';
    }

    // Инициализация
    document.getElementById('cartIcon').addEventListener('click', openCart);
    document.getElementById('backButton').addEventListener('click', goBackToCatalog);
    renderProducts();
    updateCartUI();

    window.onclick = function(event) {
      const modal = document.getElementById('cartModal');
      if (event.target === modal) closeCart();
    }
  </script>
</body>
    </html>
