<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник Тренировок 6-Дней</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #eeeeee;
            margin: 0;
            padding: 15px 15px 100px 15px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
        }

        h2 {
            font-size: 18px;
            color: #fff;
            margin-top: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #00adb5;
            padding-left: 10px;
        }

        .days-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .day-btn {
            background-color: #1e1e1e;
            color: #eeeeee;
            border: 2px solid #333;
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .day-btn small {
            display: block;
            font-size: 10px;
            color: #888888;
            font-weight: normal;
            margin-top: 2px;
        }

        .day-btn.active {
            background-color: #00adb5;
            color: #000000;
            border-color: #00adb5;
        }

        .day-btn.active small {
            color: #222222;
        }

        .exercise-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .exercise-header {
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .exercise-title {
            font-size: 16px;
            font-weight: bold;
            color: #00adb5;
            line-height: 1.3;
        }

        .set-row {
            display: grid;
            grid-template-columns: 30px 1fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: #252525;
            padding: 8px;
            border-radius: 6px;
        }

        .set-number {
            font-weight: bold;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 10px;
            color: #888888;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
        }

        .input-group input {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 5px;
            border-radius: 4px;
            font-size: 15px;
            text-align: center;
            width: 90%;
            box-sizing: border-box;
        }

        .history-hint {
            font-size: 11px;
            color: #ff9f43;
            margin-top: 4px;
            text-align: center;
            min-height: 14px;
            font-weight: 500;
        }

        .save-btn {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            width: calc(100% - 30px);
            background-color: #28c76f;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(40, 199, 111, 0.4);
            z-index: 100;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>🏋️‍♂️ Мой Тренировочный Дневник</h1>
    
    <div class="days-nav">
        <button class="day-btn active" id="btn-пн" onclick="switchDay('пн')">ПН<small>Верх тела</small></button>
        <button class="day-btn" id="btn-вт" onclick="switchDay('вт')">ВТ<small>Низ тела</small></button>
        <button class="day-btn" id="btn-ср" onclick="switchDay('ср')">СР<small>Грудь/Плечи</small></button>
        <button class="day-btn" id="btn-чт" onclick="switchDay('чт')">ЧТ<small>Спина</small></button>
        <button class="day-btn" id="btn-пт" onclick="switchDay('пт')">ПТ<small>Руки</small></button>
        <button class="day-btn" id="btn-сб" onclick="switchDay('сб')">СБ<small>Ноги/Пл/Кор</small></button>
    </div>

    <div id="workout-container"></div>

    <button class="save-btn" onclick="saveCurrentWorkout()">💾 Сохранить тренировку</button>

<script>
    var program = {
        "пн": {
            title: "Понедельник: Весь верх тела (Объемная)",
            exercises: [
                { id: "p1", name: "Жим гантелей на наклонной скамье (30°)", sets: 3 },
                { id: "p2", name: "Тяга верхнего блока узким параллельным хватом", sets: 3 },
                { id: "p3", name: "Отжимания на брусьях (с весом)", sets: 3 },
                { id: "p4", name: "Тяга гантели к поясу в упоре (на толщину)", sets: 3 },
                { id: "p5", name: "Махи гантелями в стороны (на ширину)", sets: 4 },
                { id: "p6", name: "Сгибания на бицепс с гантелями на наклонной скамье", sets: 3 }
            ]
        },
        "вт": {
            title: "Вторник: Весь низ тела",
            exercises: [
                { id: "v1", name: "Приседания со штангой на спине (или в Смите)", sets: 3 },
                { id: "v2", name: "Румынская тяга со штангой или гантелями", sets: 3 },
                { id: "v3", name: "Выпады назад в движении или на месте", sets: 2 },
                { id: "v4", name: "Подъемы на носки сидя или стоя", sets: 3 }
            ]
        },
        "ср": {
            title: "Среда: Грудь и Плечи (Акцент: Верх и Ширина)",
            exercises: [
                { id: "s1", name: "Жим штанги на наклонной скамье в Смите", sets: 3 },
                { id: "s2", name: "Сведения в кроссовере снизу вверх", sets: 3 },
                { id: "s3", name: "Махи через стороны на нижнем блоке (в кроссовере)", sets: 4 },
                { id: "s4", name: "Разведения рук назад в тренажере (пег-дек)", sets: 3 }
            ]
        },
        "чт": {
            title: "Четверг: Спина (Акцент: Широчайшие и Толщина)",
            exercises: [
                { id: "c1", name: "Тяга Т-грифа или рычажная тяга на толщину", sets: 3 },
                { id: "c2", name: "Тяга верхнего блока к груди широким хватом", sets: 3 },
                { id: "c3", name: "Пуловер на верхнем блоке с канатной рукоятью", sets: 3 },
                { id: "c4", name: "Шраги с гантелями", sets: 2 }
            ]
        },
        "пт": {
            title: "Пятница: Руки",
            exercises: [
                { id: "pt1", name: "Французский жим с EZ-грифом лежа", sets: 3 },
                { id: "pt2", name: "Подъемы штанги на бицепс на скамье Скотта", sets: 3 },
                { id: "pt3", name: "Разгибания на трицепс на блоке с канатом", sets: 3 },
                { id: "pt4", name: "Сгибания «Молот» с гантелями", sets: 3 }
            ]
        },
        "сб": {
            title: "Суббота: Ноги, Плечи, Кор",
            exercises: [
                { id: "sb1", name: "Жим ногами в платформе", sets: 3 },
                { id: "sb2", name: "Сгибания ног в тренажере сидя или лежа", sets: 3 },
                { id: "sb3", name: "Махи гантелями в стороны стоя", sets: 4 },
                { id: "sb4", name: "Скручивания на пресс на верхнем блоке «Молитва»", sets: 3 },
                { id: "sb5", name: "Планка со смещением веса или «Вакуум»", sets: 3 }
            ]
        }
    };

    var currentDay = 'пн';
    var workoutHistory = {};
    
    try {
        var savedHistory = localStorage.getItem('workoutHistory');
        if (savedHistory) {
            workoutHistory = JSON.parse(savedHistory);
        }
    } catch (e) {
        console.log("Ошибка чтения localStorage");
    }

    function renderWorkout(day) {
        var container = document.getElementById('workout-container');
        var data = program[day];
        if (!data) return;

        var html = '<h2>' + data.title + '</h2>';
        
        for (var i = 0; i < data.exercises.length; i++) {
            var ex = data.exercises[i];
            html += '<div class="exercise-card" data-ex-id="' + ex.id + '">' +
                        '<div class="exercise-header">' +
                            '<div class="exercise-title">' + ex.name + '</div>' +
                        '</div>' +
                        '<div class="sets-list">';
            
            var exHistory = workoutHistory[ex.id] || [];
            var isTimeBased = ex.name.indexOf("Планка") !== -1 || ex.name.indexOf("Вакуум") !== -1;
            var repsLabel = isTimeBased ? "Сек" : "Повторы";

            for (var j = 1; j <= ex.sets; j++) {
                var pastSet = exHistory[j - 1];
                var hintText = 'Было: —';
                if (pastSet) {
                    hintText = isTimeBased ? 'Было: ' + pastSet.reps + ' сек' : 'Было: ' + pastSet.weight + 'кг × ' + pastSet.reps;
                }

                html += '<div class="set-row" data-set-num="' + j + '">' +
                            '<div class="set-number">' + j + '</div>' +
                            '<div class="input-group">' +
                                '<label>' + (isTimeBased ? "Сет" : "Вес (кг)") + '</label>' +
