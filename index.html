<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник Тренировок 6-Дней</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #888888;
            --success-color: #393e46;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        h1, h2, h3 {
            margin: 0 0 10px 0;
        }

        .days-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid #333;
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .day-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .workout-section {
            display: none;
        }

        .workout-section.active {
            display: block;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .exercise-header {
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .exercise-title {
            font-size: 18px;
            color: var(--accent-color);
        }

        .set-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: #252525;
            padding: 8px;
            border-radius: 6px;
        }

        .set-number {
            font-weight: bold;
            color: var(--text-muted);
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .input-group input {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        .history-hint {
            font-size: 11px;
            color: #ff9f43;
            margin-top: 2px;
            min-height: 14px;
        }

        .save-btn {
            width: 100%;
            background-color: #28c76f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .save-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>🏋️‍♂️ Мой Тренировочный Дневник</h1>
    
    <!-- Навигация по 6 дням недели -->
    <div class="days-nav">
        <button class="day-btn active" onclick="switchDay('пн')">ПН<br><small>Верх</small></button>
        <button class="day-btn" onclick="switchDay('вт')">ВТ<br><small>Низ</small></button>
        <button class="day-btn" onclick="switchDay('ср')">СР<br><small>Грудь/Пл</small></button>
        <button class="day-btn" onclick="switchDay('чт')">ЧТ<br><small>Спина</small></button>
        <button class="day-btn" onclick="switchDay('пт')">ПТ<br><small>Руки</small></button>
        <button class="day-btn" onclick="switchDay('сб')">СБ<br><small>Низ/Пл</small></button>
    </div>

    <!-- Контейнер, куда скрипт сам добавит упражнения -->
    <div id="workout-container"></div>

    <button class="save-btn" onclick="saveCurrentWorkout()">💾 Сохранить Тренировку</button>

<script>
    // База данных вашей 6-дневной программы с акцентами (упражнения и количество подходов)
    const program = {
        "пн": {
            title: "Понедельник: Весь верх тела",
            exercises: [
                { id: "p1", name: "Жим гантелей на наклонной скамье (30°)", sets: 3 },
                { id: "p2", name: "Тяга верхнего блока узким паралл. хватом", sets: 3 },
                { id: "p3", name: "Отжимания на брусьях (с весом)", sets: 3 },
                { id: "p4", name: "Тяга гантели к поясу в упоре", sets: 3 },
                { id: "p5", name: "Махи гантелями в стороны", sets: 4 },
                { id: "p6", name: "Сгибания на бицепс на наклонной скамье", sets: 3 }
            ]
        },
        "вт": {
            title: "Вторник: Весь низ тела",
            exercises: [
                { id: "v1", name: "Приседания со штангой (или в Смите)", sets: 3 },
                { id: "v2", name: "Румынская тяга", sets: 3 },
                { id: "v3", name: "Выпады назад (на месте)", sets: 2 },
                { id: "v4", name: "Подъемы на носки", sets: 3 }
            ]
        },
        "ср": {
            title: "Среда: Грудь и Плечи (Акцент: верх и ширина)",
            exercises: [
                { id: "s1", name: "Жим штанги на наклонной скамье в Смите", sets: 3 },
                { id: "s2", name: "Сведения в кроссовере снизу вверх", sets: 3 },
                { id: "s3", name: "Махи через стороны на нижнем блоке", sets: 4 },
                { id: "s4", name: "Разведения рук назад в тренажере (пег-дек)", sets: 3 }
            ]
        },
        "чт": {
            title: "Четверг: Спина (Акцент: широчайшие и толщина)",
            exercises: [
                { id: "c1", name: "Тяга Т-грифа или рычажная тяга", sets: 3 },
                { id: "c2", name: "Тяга верхнего блока к груди широким хватом", sets: 3 },
                { id: "c3", name: "Пуловер на верхнем блоке с канатом", sets: 3 },
                { id: "c4", name: "Шраги с гантелями", sets: 2 }
            ]
        },
        "пт": {
            title: "Пятница: Руки",
            exercises: [
                { id: "pt1", name: "Французский жим с EZ-грифом лежа", sets: 3 },
                { id: "pt2", name: "Подъемы штанги на бицепс на скамье Скотта", sets: 3 },
                { id: "pt3", name: "Разгибания на трицепс на блоке с канатом", sets: 3 },
                { id: "pt4", name: "Сгибания «Молот» с гантелями", sets: 3 }
            ]
        },
        "сб": {
            title: "Суббота: Ноги, Плечи, Кор",
            exercises: [
                { id: "sb1", name: "Жим ногами в платформе", sets: 3 },
                { id: "sb2", name: "Сгибания ног в тренажере", sets: 3 },
                { id: "sb3", name: "Махи гантелями в стороны стоя", sets: 4 },
                { id: "sb4", name: "Скручивания на пресс «Молитва»", sets: 3 }
            ]
        }
    };

    let currentDay = 'пн';
    // Структура истории: { exerciseId: [ {set1_weight, set1_reps}, ... ] }
    let workoutHistory = JSON.parse(localStorage.getItem('workoutHistory')) || {};

    // Отрисовка интерфейса под выбранный день
    function renderWorkout(day) {
        const container = document.getElementById('workout-container');
        const data = program[day];
        
        let html = `<h2>${data.title}</h2>`;
        
        data.exercises.forEach(ex => {
            html += `
                <div class="exercise-card" data-ex-id="${ex.id}">
                    <div class="exercise-header">
                        <div class="exercise-title">${ex.name}</div>
                    </div>
                    <div class="sets-list">
            `;
            
            // Получаем историю конкретно для этого упражнения
            const exHistory = workoutHistory[ex.id] || [];

            for (let i = 1; i <= ex.sets; i++) {
                // Ищем данные по подходу с прошлой тренировки
                const pastSet = exHistory[i - 1];
                const hintText = pastSet ? `Было: ${pastSet.weight}кг × ${pastSet.reps}` : 'Было: —';

                html += `
                    <div class="set-row" data-set-num="${i}">
                        <div class="set-number">${i}</div>
                        <div class="input-group">
                            <label>Вес (кг)</label>
                            <input type="number" class="weight-input" placeholder="0" step="0.5">
                            <div class="history-hint">${hintText}</div>
                        </div>
                        <div class="input-group">
                            <label>Повторы</label>
                            <input type="number" class="reps-input" placeholder="0">
                            <div class="history-hint"></div>
                        </div>
                    </div>
                `;
            }
            
            html += `</div></div>`;
        });
        
        container.innerHTML = html;
    }

    // Переключение вкладок дней недели
    function switchDay(day) {
        currentDay = day;
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        renderWorkout(day);
    }

    // Сохранение весов текущего дня
    function saveCurrentWorkout() {
        const cards = document.querySelectorAll('.exercise-card');
        
        cards.forEach(card => {
            const exId = card.getAttribute('data-ex-id');
